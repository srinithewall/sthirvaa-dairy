name: Deploy Frontend to AWS

on:
  push:
    branches: [ main ]
    paths:
      - 'dairy-ui/**'
      - '.github/workflows/deploy-frontend.yml'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/dairy-ui

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './dairy-ui/package-lock.json'

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./dairy-ui
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Deploy to AWS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 3.109.153.201
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ~/dairy-deployment
            cd ~/dairy-deployment
            
            # Update the full docker-compose file. Keep the app service identical to
            # deploy-backend.yml: if this copy drops the volume or env_file, the next time the
            # backend container is recreated it loses Firebase (push notifications) and the AMCS
            # settings - which is what silently stopped both on 8 Nov 2026.
            cat <<EOF > docker-compose.yml
            version: '3.8'
            services:
              app:
                image: ${{ env.REGISTRY }}/${{ github.repository_owner }}/dairy-backend:latest
                container_name: dairy-backend
                volumes:
                  - ./resources/service-account.json:/app/firebase-service-account.json
                env_file:
                  - ./amcs.env
                environment:
                  - DB_URL=${{ secrets.DB_URL }}
                  - DB_USER=${{ secrets.DB_USER }}
                  - DB_PASSWORD=${{ secrets.DB_PASSWORD }}
                  - JWT_SECRET=${{ secrets.JWT_SECRET }}
                restart: always
                network_mode: "host"

              ui:
                image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
                container_name: dairy-ui
                restart: always
                network_mode: "host"
            EOF

            # env_file must exist or compose refuses to run (see deploy-backend.yml)
            touch amcs.env

            # Authenticate Docker to GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # Pull the new image
            docker compose pull ui
            
            # Kill any host-level process running on port 3000 to avoid EADDRINUSE bind conflicts
            echo "Freeing up port 3000..."
            sudo fuser -k 3000/tcp || true
            sudo kill -9 $(sudo lsof -t -i:3000) 2>/dev/null || true
            
            # Restart the UI container
            docker compose up -d ui
            
            docker image prune -f
