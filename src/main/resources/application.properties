# SSO identity provider (NG Core backend).
# Must be reachable server-to-server: the localhost default only works when the
# NG Core API runs in this same container/VM. Override with SSO_IDP_URL in prod.
sso.idp.url=${SSO_IDP_URL:http://localhost:8054/api/auth/sso/exchange}

# ============================================================================
# Feed Optimizer
# ============================================================================
# PLACEHOLDER / PENDING VALIDATION: these DIM (days-in-milk) and age breakpoints
# decide which of the 10 AnimalRequirement.animalStage rows an animal resolves
# to. They are commonly-cited dairy-science ranges, NOT confirmed against this
# herd's own AnimalRequirement data (which is itself still seeded with dummy
# nutrient values - see FeedDataSeeder). Treat these the same as the nutrient
# numbers: adjust here once validated, no code change required.
# Ordered ascending to match FeedDataSeeder's stage array (Fresh -> Early -> Peak -> Mid -> Late).
feed-optimizer.stage-mapping.fresh-cow-max-dim=15
feed-optimizer.stage-mapping.early-lactation-max-dim=100
feed-optimizer.stage-mapping.peak-lactation-max-dim=150
feed-optimizer.stage-mapping.mid-lactation-max-dim=200
# beyond mid-lactation-max-dim => Late Lactation, until a DRY_PERIOD_STARTED event
feed-optimizer.stage-mapping.calf-3-month-max-age-days=120
feed-optimizer.stage-mapping.calf-6-month-max-age-days=210
feed-optimizer.stage-mapping.heifer-1-year-max-age-days=450

# Per-feed default bounds used only when FeedMaster.minDailyQtyKg/maxDailyQtyKg
# are not populated yet - a practical guard against absurd single-feed
# quantities, not a nutrition fact. Adjust or override per feed as real
# constraint data is entered.
feed-optimizer.constraints.default-min-qty-kg=0
feed-optimizer.constraints.default-max-qty-kg=50
# Feed categories (FeedMaster.category, free-text) counted toward the
# concentrate cap below.
feed-optimizer.constraints.concentrate-categories=Concentrate,Grain,Byproduct
# Max share of total ration Dry Matter that concentrate-category feeds may supply.
feed-optimizer.constraints.max-concentrate-share-of-dm=0.5
# Upper-bound tolerance applied to each nutrient requirement (e.g. 1.3 = cap
# oversupply at 130% of the requirement) when building solver constraints.
feed-optimizer.constraints.nutrient-upper-bound-tolerance=5.0

# Objective weights - centralized so they are not scattered through service
# code. Higher weight = solver tries harder to minimize that term.
feed-optimizer.objective.default-plan.cost-weight=1.0
feed-optimizer.objective.default-plan.oversupply-weight=0.5
feed-optimizer.objective.current-ration.cost-weight=0.3
feed-optimizer.objective.current-ration.oversupply-weight=0.5
feed-optimizer.objective.current-ration.change-weight=2.0
# Quantity changes below this (kg/day) are treated as solver/rounding noise
# and omitted from ADD/REDUCE recommendations.
feed-optimizer.objective.change-epsilon-kg=0.05
