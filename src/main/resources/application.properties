spring.application.name=DairyManagementSystem
server.port=8080

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/dairy?createDatabaseIfNotExist=true&sslMode=DISABLED&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:sthi}
spring.datasource.password=${DB_PASSWORD:Sthirva@26}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# 10 is HikariCP's own default. 5 left little headroom once the scheduled jobs
# (chore generation, reminder sweeps) compete with user requests for a connection.
spring.datasource.hikari.maximum-pool-size=10

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# JWT and Security
jwt.secret=${JWT_SECRET:DairySecretKeyForJwtAuthenticationWhichShouldBeLongEnoughToAvoidErrors}
app.jwtSecret=${jwt.secret}
jwt.expirationMs=86400000
app.jwtExpirationMs=${jwt.expirationMs}

# Proxy / Forwarded Headers support
server.forward-headers-strategy=framework

# Logging
logging.level.com.dairy=INFO
logging.level.org.springframework.security=INFO

# OpenAPI (optional)
# springdoc.api-docs.path=/api-docs

